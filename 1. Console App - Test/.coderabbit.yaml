# CodeRabbit Configuration
# This file configures CodeRabbit behavior for code reviews

# Review settings
reviews:
  # Enable/disable the review
  enabled: true
  
  # Request review on draft PRs
  request_review_on_draft: true
  
  # Show review status
  show_status: true
  
  # Auto approve certain changes
  auto_approve: false

# Rules for failed reviews
rules:
  # Fail review on critical issues
  fail_on_critical: true
  
  # Fail review on high severity issues
  fail_on_high_severity: true
  
  # Report the review status
  report_status: true

# Comments and feedback
comments:
  # Enable inline comments
  enable_inline_comments: true
  
  # Show summary comment
  show_summary: true
  
  # Comment on review completion
  comment_on_complete: true

# Status checks
status_checks:
  # Enable status checks
  enabled: true
  
  # Set status context name
  context: "CodeRabbit"
  
  # Mark as failed if issues found
  fail_on_issues: true
  
  # Show success status
  show_success: true

# Code quality standards
quality:
  # Fail if quality score below threshold
  min_quality_score: 60
  
  # Check code complexity
  check_complexity: true
  
  # Check for security issues
  check_security: true

# Output configuration
output:
  # Display review results in PR
  display_results: true
  
  # Show failed checks
  show_failures: true
  
  # Show passed checks
  show_passes: false
  
  # Summary detail level (concise, detailed)
  summary_level: "detailed"
