# CodeRabbit Configuration
# This file configures CodeRabbit behavior for code reviews

reviews:
  # Auto review settings for drafts
  auto_review:
    drafts: true
  
  # Review status visibility
  review_status: true

  message_type: error
  
  # Commit status checks configuration
  commit_status: true
  fail_commit_status: true
  
  # Comment configuration
  high_level_summary: true
  changed_files_summary: true
  collapse_walkthrough: false
  
  # Pre-merge checks for failed reviews
  pre_merge_checks:
      enabled: true
      
      mode: error

  # Output and summary settings
  show_summary: true
  show_failures: true
